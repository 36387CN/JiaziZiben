<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unity AR+GPS Location Map Editor</title>

    
    <link rel="stylesheet" href="/vendor/spectre.min.css">
    <script src='https://api.tiles.mapbox.com/mapbox-gl-js/v1.4.1/mapbox-gl.js'></script>
    <script src="/vendor/xml2json.min.js"></script>
    <link href='https://api.tiles.mapbox.com/mapbox-gl-js/v1.4.1/mapbox-gl.css' rel='stylesheet' />

    <script src='https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.4.2/mapbox-gl-geocoder.min.js'></script>
    <link rel='stylesheet' href='https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v4.4.2/mapbox-gl-geocoder.css' type='text/css' />
    <!-- Promise polyfill script required to use Mapbox GL Geocoder in IE 11 -->
    <script src="https://cdn.jsdelivr.net/npm/es6-promise@4/dist/es6-promise.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/es6-promise@4/dist/es6-promise.auto.min.js"></script>
    
    <style>
      body, html {
	  margin: 0;
	  padding: 0;
	  overflow: hidden;
	  width: 100%;
	  height: 100%;
      }
      .sidebar {
	  /* 原先的 fixed 定位会被后续覆盖，这里保留原样，后面用更具体的规则重写 */
	  position: fixed;
	  width: 550px;
	  height: 100%;
      }

      .map-container {
	  height: 100%;
	  position: relative;
	  /* left: 400px; */
	  /* top: 0px; */
	  width: auto;
	  margin-left: 550px
      }

      .mt-10 {
	  margin-top: 20px !important;
      }

      .inactiveLink {
	  pointer-events: none;
	  cursor: pointer;
      }

      .side-scroll {
	  overflow-x: none;
	  overflow-y: auto;
      }

      .pointer { cursor: pointer; }


      .help-tip{
	  position: fixed;
	  bottom: 40px;
	  right: 20px;
	  text-align: center;
	  background-color: #37b4ef;
	  border-radius: 50%;
	  width: 48px;
	  height: 48px;
	  font-size: 28px;
	  line-height: 48px;
	  cursor: default;
	  z-index: 20000;
	  cursor: pointer;
      }

      .help-tip:before{
	  content:'?';
	  font-weight: bold;
	  color:#fff;
      }
      
      /* ========= 新增布局调整：整体宽度95%，居中，flex排列 ========= */
      .main-wrapper {
        display: flex;
        width: 98%;
        max-width: 100%;        /* 可选，防止过宽，可自行调整 */
        height: 100%;
        margin: 0 auto;
      }

      /* 覆盖侧边栏样式：取消固定定位，宽度保持550px，高度占满，背景保留 */
      .main-wrapper .sidebar {
        position: relative;
        width: 550px;
        height: 100%;
        background-color: #ffffff;  /* bg-gray 的等效色，保留原类即可 */
        flex-shrink: 0;              /* 防止 flex 压缩侧边栏宽度 */
      }

      /* 覆盖地图容器样式：取消左边距，让 flex 接管剩余宽度 */
      .main-wrapper .map-container {
        margin-left: 0;
        flex: 1;                     /* 占据剩余所有宽度 */
        height: 100%;
        position: relative;
      }

      /* 保持 side-scroll 滚动能力 */
      .main-wrapper .sidebar.side-scroll {
        overflow-y: auto;
      }
    </style>

  </head>
  <body>

    <div class="help-tip" onClick="window.open('/unity-ar-gps-location-map/help/3.html', '_blank');"></div>
    
    <!-- 新增外层包裹容器，宽度95%居中，flex布局 -->
    <div class="main-wrapper">
      <div class="sidebar side-scroll bg-gray">

        <div class="menu">
          <li class="divider" data-content="Current Point"></li>
          <li class="menu-item">
            <span>标记数量</span>
            <div class="menu-badge">
              <span id="id-value">---</span>
            </div>	    
          </li>
          <li class="mt-10 menu-item mt-10">
            <span>纬度</span>
            <div class="menu-badge">
              <span id="lat-value">0.000</span>
            </div>	    
          </li>
          <li class="menu-item mt-10">
            <span>经度</span>
            <div class="menu-badge">
              <span id="lng-value">0.000</span>
            </div>	    
          </li>
          <li class="menu-item mt-10">
            <span>高度模式</span>
            <div class="menu-badge">
              <select name="altitude-mode" id="altitude-mode-input" class="form-select">
                <option value="GroundRelative">Ground Relative</option>
                <option value="Absolute">Absolute</option>
                <option value="Relative">Relative</option>
                <option value="Ignore">Ignore</option>
              </select>
            </div>	    
          </li>

          <li class="menu-item mt-10">
            <span>海拔</span>
            <div class="menu-badge">
              <input type="number" id="altitude-input" class="form-input" value=0>
            </div>	    
          </li>

          <li class="menu-item mt-10">
            <span>标记名称</span>
            <div class="menu-badge">
              <input id="name-input" type="text" class="form-input">
            </div>	    
          </li>

          <li class="menu-item mt-10">
            <span>项目/线路名称</span>
            <div class="menu-badge">
              <input id="mesh-id-input" type="text" class="form-input">
            </div>	    
          </li>

          <li class="menu-item mt-10">
            <span>运动平滑</span>
            <div class="menu-badge">
              <input type="number" id="movement-smoothing-input" class="form-input" value=0.05 step=0.01>
            </div>	    
          </li>

          <li class="menu-item mt-10">
            <span>最大位置更新次数</span>
            <div class="menu-badge">
              <input type="number" id="max-number-location-updates-input" class="form-input" value=0 step=1>
            </div>	    
          </li>

          <li class="menu-item mt-10">
            <span>使用移动平均</span>
            <div class="menu-badge">
              <label class="form-checkbox">
                <input type="checkbox" id="use-moving-average-input">
                <i class="form-icon"></i> 
              </label>
            </div>	    
          </li>

          <li class="menu-item mt-10">
            <span>隐藏物体直到放置</span>
            <div class="menu-badge">
              <label class="form-checkbox">
                <input type="checkbox" id="hide-object-until-placed-input">
                <i class="form-icon"></i> 
              </label>
            </div>	    
          </li>

          <div class="btn-group btn-group-block mt-10">
            <button id="add-marker-button" class="btn btn-sm">添加标记</button>
            <button id="remove-marker-button" class="btn btn-sm">移除标记</button>
            <button id="clear-all-button" class="btn btn-sm">移除所有标记</button>
          </div>

          <div class="btn-group btn-group-block mt-10">
            <button id="download-json-button" class="btn btn-sm">下载 JSON</button>
            <button id="download-xml-button" class="btn btn-sm">下载 XML</button>

            <input id="json-file-input" type='file' name='filename' accept=".json" multiple hidden/>
            <button id="upload-json-button" class="btn btn-sm">上传 JSON</button>
            
            <input id="xml-file-input" type='file' name='filename' accept=".xml" multiple hidden/>
            <button id="upload-xml-button" class="btn btn-sm">上传 XML</button>
          </div>
          

          <li class="divider" data-content="List of Points"></li>

          <div id="points-list">
            <li class="mt-10 menu-item mt-10 active">
              <a href="#" class="active">
                <span>Latitude</span>
              </a>
            </li>
          </div>
          
        </div>
      </div>

      <div id="map-containter" class="map-container"></div>
    </div>  <!-- end .main-wrapper -->

  

<script src="index.js"></script>
</body>
</html>
